name: Minimal Linux (U-Boot)

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-minimal-linux-uboot.sh"
      - ".github/workflows/minimal-linux-uboot.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  push:
    branches: ["main"]
    paths:
      - ".cargo/**"
      - ".github/scripts/prototyper-minimal-linux-uboot.sh"
      - ".github/workflows/minimal-linux-uboot.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "xtask/**"
      - "library/**"
      - "firmware/macros/**"
      - "firmware/prototyper/**"
      - "firmware/runtime/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  minimal-linux-uboot-boot:
    name: Boot minimal Linux via U-Boot
    # U-Boot 2024.04's pylibfdt does not compile with swig >= 4.3, and gcc >= 14
    # defaults to a RISC-V march that emits Zba/Zbb instructions the QEMU virt
    # CPU does not support, so pin the runner to 24.04 (swig 4.2, gcc 13).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            e2fsprogs \
            flex \
            gcc-riscv64-linux-gnu \
            libc6-dev-riscv64-cross \
            libssl-dev \
            parted \
            python3-dev \
            python3-setuptools \
            qemu-system-misc \
            qemu-utils \
            swig \
            xz-utils
          qemu-system-riscv64 --version

      - name: Install required cargo
        run: cargo install --locked cargo-binutils@0.4.0

      # Only the kernel image and BusyBox installation are cached. U-Boot is
      # rebuilt every run because the SPL embeds the RustSBI firmware under
      # test. Bump the trailing revision after editing the build recipe.
      - name: Cache Linux kernel and BusyBox builds
        uses: actions/cache@v5
        with:
          path: .cache/minimal-linux-uboot
          key: minimal-linux-uboot-kernel-6.12.110-busybox-1.36.1-v1

      - name: Build RustSBI Prototyper
        run: cargo prototyper build

      - name: Boot minimal Linux via U-Boot
        run: .github/scripts/prototyper-minimal-linux-uboot.sh

      - name: Upload minimal Linux (U-Boot) log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minimal-linux-uboot-log
          path: qemu-logs/prototyper-minimal-linux-uboot.log
